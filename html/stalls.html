</head>
<body>

<div class="weather-widget" id="weatherWidget">

</div>
<link rel="stylesheet" href="../css/singapore-weather.css">
<script src="../js/singapore-weather.js"></script>

<nav class="navbar">
    <div class="logo">HawkerSG</div>
    <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="stalls.html" class="active">Stalls</a></li>

        <h1 id="stallTitle">Loading stall...</h1>

<!-- Featured dishes are filled in from the database by stalls.js -->
<main class="discovery-section" id="featuredSection"></main>

    <h2 class="menu-title">Full Stall Menu</h2>

    <table class="menu-table">
        <thead>
            <tr>
                <th>Dish Name</th>
                <th>Category</th>

        </thead>

            <tr><td colspan="4">Loading menu...</td></tr>
        </tbody>
    </table>
